[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "langchain-lizard"
version = "0.1.0"
description = "Lizard Sandboxes integration for LangChain Deep Agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Lizard (lizard.build)"}]
dependencies = ["deepagents>=0.7.24,<0.8", "lizard-sdk>=0.1.60,<0.2"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://lizard.build/sandboxes"
Documentation = "https://github.com/lizard-build/langchain-lizard#readme"
Repository = "https://github.com/lizard-build/langchain-lizard"
Issues = "https://github.com/lizard-build/langchain-lizard/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8", "pytest-asyncio>=0.24", "pytest-socket>=0.7",
  "langchain-tests==1.1.9", "ruff>=0.9", "mypy>=1.15", "build>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["langchain_lizard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: creates and destroys temporary Lizard Sandboxes"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["lizard", "lizard.*"]
ignore_missing_imports = true
