name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from pyproject.toml
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as file:
              version = tomllib.load(file)['project']['version']
          assert version == os.environ['RELEASE_VERSION'], 'Version does not match pyproject.toml'
          PY
      - run: python -m pip install -e '.[dev]' twine
      - run: ruff check .
      - run: mypy langchain_lizard
      - run: pytest tests/unit_tests --disable-socket --allow-unix-socket
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
