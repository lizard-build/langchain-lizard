name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]' twine
      - run: ruff check .
      - run: mypy langchain_lizard
      - run: pytest tests/unit_tests --disable-socket --allow-unix-socket
      - run: python -m build
      - run: twine check dist/*
